cargo-features = ["panic-immediate-abort"]

[package]
name = "dump-bgra"
version = "0.1.0"
edition = "2024"

[dependencies]
fast_image_resize = {version = "6.0.0", default-features = false, features = ["rayon"]}
image = {version = "0.25.10"}
memmap2 = {version = "0.9.11", default-features = false}
rayon = {version = "1.12.0", default-features = false}

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "immediate-abort"
